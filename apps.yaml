# The app list for Setup Tool. Add/edit entries here - no code changes
# needed. Each entry:
#
#   id:          unique slug, also used as the build-dir name
#   name:        shown in the checklist
#   category:    groups entries into sections in the UI
#   description: shown as a tooltip
#   method:      "pacman" (plain official-repo install) or "pkgbuild"
#                (build+install a PKGBUILD - AUR replacements or your own apps)
#   package:     pacman method only - the package name
#   source:      pkgbuild method only - dir (relative to this file) holding
#                the PKGBUILD, used when it's bundled here in pkgbuilds/
#   git:         pkgbuild method only - a git remote to clone instead of
#                `source`, for your own separately-hosted project repos
#   services:    optional - systemd units to `systemctl enable --now` after
#                install (in the same single password prompt as the install)
#   fallback:    pacman method only, optional - dir holding a bundled
#                PKGBUILD to build instead when no sync repo has `package`
#                (e.g. [cachyos]-only packages on plain Arch). Without one,
#                such apps show as Unavailable.
#   next_steps:  optional - manual follow-up (logins etc.) shown after a
#                successful run, for things the tool can't do for you

