[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setup-tool"
version = "0.1.0"
description = "Personal app-installer checklist GUI"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
